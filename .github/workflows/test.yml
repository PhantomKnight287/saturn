name: Test

on:
  push:

jobs:
  unit:
    name: Unit & integration (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saturn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saturn_test
      BETTER_AUTH_SECRET: test-secret-not-for-production
      GITHUB_CLIENT_ID: test
      GITHUB_CLIENT_SECRET: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      EMAIL_PROXY: http://localhost:9999
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run migrations
        run: bun db:migrate
      - name: Vitest
        run: bun test

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saturn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saturn_test
      BETTER_AUTH_SECRET: test-secret-not-for-production
      GITHUB_CLIENT_ID: test
      GITHUB_CLIENT_SECRET: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      EMAIL_PROXY: http://localhost:9999
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: bun test:e2e:install
      - name: Run migrations
        run: bun db:migrate
      - name: Playwright
        run: bun test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
