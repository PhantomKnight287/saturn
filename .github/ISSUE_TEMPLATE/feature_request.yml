name: Feature request
description: Suggest a new feature or enhancement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who feels it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see. UI sketches or flow descriptions welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.

  - type: dropdown
    id: area
    attributes:
      label: Area of the app
      options:
        - Proposals
        - Requirements
        - Team / members
        - Billing / invoices
        - Auth / onboarding
        - Settings
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
